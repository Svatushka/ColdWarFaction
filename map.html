<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Map — Cold War Factions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e100c; --bg2:#151a11; --line:#2b3323; --accent:#c8d94e; --text:#e9ebda;
    --muted:#98a08a; --map-bg:#1a1a1a; --shadow: rgba(0,0,0,0.5);
  }
  body.light-theme {
    --bg:#f4f6f0; --bg2:#ffffff; --line:#d0d6c5; --accent:#9abf2b; --text:#1a1e16; --muted:#5c6654; --shadow: rgba(0,0,0,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
    overflow:hidden; height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s;
  }
  header{
    background:rgba(14,16,12,.95); border-bottom:1px solid var(--line); display: flex;
    align-items: center; justify-content: space-between; padding: 8px 16px; height: 50px; flex-shrink: 0;
  }
  body.light-theme header { background:rgba(255,255,255,.95); }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .back-btn {
    color: var(--text); text-decoration: none; font-family: 'Oswald', sans-serif; font-size: 14px;
    font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 8px; transition: color 0.2s;
  }
  .back-btn:hover { color: var(--accent); }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    background: transparent; border: 1px solid var(--line); color: var(--text); width: 30px; height: 30px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: all 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lang-switch{ display:flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:6px; background:rgba(255,255,255,.02); }
  .lang{
    border:0; background:transparent; color:var(--muted); font-family:'Inter',sans-serif; font-size:11px;
    font-weight:600; letter-spacing:.08em; padding:4px 8px; border-radius:4px; cursor:pointer; transition:all .18s;
  }
  .lang:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .lang.active{ background:var(--accent); color:#12140c; }

  .map-tool-section { display: flex; flex: 1; background: var(--map-bg); overflow: hidden; position: relative; }
  .map-sidebar {
    width: 260px; background: #232a22; border-right: 1px solid #333; padding: 12px 12px;
    display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0; z-index: 10;
  }
  body.light-theme .map-sidebar { background: #e9ebda; border-right-color: #ccc; }
  .map-sidebar-group { display: flex; flex-direction: column; gap: 5px; }
  .map-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .map-select {
    width: 100%; background: var(--bg2); border: 1px solid var(--line); color: var(--text);
    padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 13px; outline: none;
  }
  .map-select option { background: var(--bg2); color: var(--text); }
  .map-btn {
    background: var(--line); border: 1px solid var(--line); color: var(--text); padding: 7px 8px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; white-space: nowrap;
  }
  .map-btn:hover { background: var(--bg2); border-color: var(--accent); }
  .map-btn.active { background: var(--accent); color: #12140c; border-color: var(--accent); }
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .tool-grid .map-btn[data-tool="pan"] { grid-column: span 2; }
  .color-palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .color-swatch {
    aspect-ratio: 1; border-radius: 3px; border: 2px solid transparent; cursor: pointer; padding: 0;
    transition: transform 0.1s, border-color 0.2s; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); position: relative;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.6); }
  .custom-color-btn {
    background: linear-gradient(135deg, #e74c3c, #f1c40f, #2ecc71, #3498db); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; border: 1px solid var(--line);
  }
  #colorPicker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .size-header { display: flex; justify-content: space-between; align-items: center; }
  .size-value { background: var(--bg2); border: 1px solid var(--line); color: var(--text); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; min-width: 28px; text-align: center; }
  .map-range { width: 100%; cursor: pointer; accent-color: #4a90e2; height: 4px; }
  .bottom-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; }
  .bottom-actions .btn-save { grid-column: span 2; }
  .btn-undo { background: var(--line); color: var(--text); }
  .btn-clear { background: #6b2626; color: #fff; border-color: #8a2d2d; }
  .btn-clear:hover { background: #8a2d2d; border-color: #ff4d4d; }
  .btn-save { background: #27ae60; color: #fff; border-color: #2ecc71; }
  .btn-save:hover { background: #2ecc71; border-color: #27ae60; }

  /* КОНТЕЙНЕР И СЛОИ */
  .map-canvas-wrapper {
    flex: 1; position: relative; background: #111; overflow: hidden;
    display: flex; align-items: center; justify-content: center; cursor: default;
  }
  
  .canvas-container {
    position: relative; /* Чтобы слои накладывались друг на друга */
    transform-origin: center center;
    background: #1a1a1a; /* Фон вокруг карты */
  }

  /* Фоновая картинка карты */
  #bgMap {
    position: absolute;
    display: block;
    pointer-events: none; /* Клики проходят сквозь картинку на холст */
    user-select: none;
  }

  /* Холст для рисования (лежит поверх карты) */
  #tacticalCanvas {
    position: absolute;
    top: 0; left: 0;
    display: block;
    cursor: crosshair; 
    background: transparent;
  }
  
  .map-canvas-wrapper.pan-active { cursor: grab !important; }
  .map-canvas-wrapper.pan-active:active { cursor: grabbing !important; }
  
  .beta-badge {
    position: absolute; top: 15px; left: 15px; background: rgba(255, 77, 77, 0.1);
    border: 1px solid #ff4d4d; color: #ff4d4d; padding: 4px 10px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; border-radius: 4px; z-index: 10; pointer-events: none;
  }
  .zoom-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
  .zoom-btn {
    width: 36px; height: 36px; background: #232a22; border: 1px solid #3a4a35; color: #fff; font-size: 18px;
    border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .zoom-btn:hover { background: #35472f; border-color: var(--accent); }

  .squad-toggle {
    position: absolute; top: 15px; right: 15px; z-index: 20; background: var(--bg2); border: 1px solid var(--accent);
    color: var(--accent); padding: 8px 16px; border-radius: 6px; font-family: 'Oswald', sans-serif; font-weight: 600;
    text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .squad-toggle:hover { background: var(--accent); color: #12140c; }
  .squad-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 320px; background: var(--bg2);
    border-left: 1px solid var(--line); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; z-index: 30; box-shadow: -10px 0 30px var(--shadow);
  }
  .squad-panel.open { transform: translateX(0); }
  .squad-panel-header { padding: 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .squad-panel-header h3 { font-family: 'Oswald', sans-serif; font-size: 16px; text-transform: uppercase; color: var(--accent); }
  .close-squad-btn { background: transparent; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .squad-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
  .squad-card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .squad-card-header { display: flex; justify-content: space-between; align-items: center; }
  .squad-name-input { background: transparent; border: none; color: var(--text); font-weight: 600; font-size: 14px; font-family: inherit; outline: none; width: 70%; border-bottom: 1px dashed transparent; }
  .squad-name-input:focus { border-bottom-color: var(--accent); }
  .squad-color-dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
  .player-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .player-tag { background: var(--line); border: 1px solid var(--muted); color: var(--text); font-size: 11px; padding: 2px 8px; border-radius: 12px; display: flex; align-items: center; gap: 5px; }
  .player-tag span { cursor: pointer; color: #e74c3c; font-weight: bold; }
  .add-player-form { display: flex; gap: 5px; }
  .add-player-input { flex: 1; background: var(--bg2); border: 1px solid var(--line); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; }
  .add-player-btn { background: var(--line); border: 1px solid var(--line); color: var(--accent); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .squad-actions { display: flex; gap: 5px; margin-top: 5px; }
  .squad-actions button { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; }
  .btn-place { background: #1e3a5f; color: #a4d4ff; border-color: #2c5a8a; }
  .btn-place:hover { background: #2c5a8a; color: #fff; }
  .btn-delete { background: #4a1c1c; color: #ffa4a4; border-color: #7a2c2c; }
  .btn-delete:hover { background: #7a2c2c; color: #fff; }
  
  .squad-marker {
    position: absolute; background: rgba(15, 20, 13, 0.9); backdrop-filter: blur(4px); border: 3px solid #3498db;
    border-radius: 8px; padding: 10px 15px; color: #fff; pointer-events: auto; cursor: grab;
    box-shadow: 0 5px 15px rgba(0,0,0,0.6); min-width: 120px; user-select: none; transform: translate(-50%, -50%); z-index: 5;
  }
  .squad-marker-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 3px; }
  .squad-marker-players { font-size: 12px; line-height: 1.4; color: #d1d9c6; }
  
  .placement-banner {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(52, 152, 219, 0.9);
    color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 14px; z-index: 50;
    pointer-events: none; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .placement-banner.active { display: block; }
  .sidebar-contact { margin-top: 15px; padding: 10px; border-radius: 6px; background: rgba(88, 101, 242, 0.1); border: 1px solid rgba(88, 101, 242, 0.3); text-align: center; font-size: 11px; }
  .sidebar-contact a { color: #5865F2; font-weight: 700; text-decoration: none; }

  @media(max-width:820px){
    body { overflow: auto; height: auto; }
    .map-tool-section { flex-direction: column; height: auto; }
    .map-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #333; }
    .map-canvas-wrapper { height: 500px; }
    .squad-panel { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="back-btn">← <span>На главную</span></a>
    <a href="factions.html" class="back-btn" style="color: var(--accent); margin-left: 10px;">🛡️ Фракции</a>
  </div>
  <div class="header-controls">
    <button class="icon-btn" id="themeToggle">🌓</button>
  </div>
</header>

<div class="map-tool-section">
  <div class="map-sidebar">
    <div class="map-sidebar-group">
      <label class="map-label">MAPS LIST</label>
      <select class="map-select" id="mapSelect">
        <option value="" disabled selected>-- Выберите карту --</option>
        <option value="valley_view">Valley View</option>
        <option value="morslingen">Morslingen</option>
        <option value="khokhlovka">Khokhlovka</option>
        <option value="vavidas">Vavidas</option>
        <option value="wukong_delta">Wukong Delta</option>
        <option value="zts_rudna">ZTS Rudna</option>
      </select>
    </div>

    <div class="map-sidebar-group">
      <label class="map-label">CUSTOM MAP</label>
      <input type="file" id="customMapUpload" accept="image/*" style="display:none">
      <button class="map-btn" onclick="document.getElementById('customMapUpload').click()">📂 Загрузить свою</button>
    </div>

    <div class="map-sidebar-group">
      <label class="map-label">TOOLS</label>
      <div class="tool-grid">
        <button class="map-btn active" data-tool="brush">🖌️ Кисть</button>
        <button class="map-btn" data-tool="line">📏 Линия</button>
        <button class="map-btn" data-tool="rect">⬜ Квадрат</button>
        <button class="map-btn" data-tool="text">T Текст</button>
        <button class="map-btn" data-tool="pan">✋ Движение</button>
      </div>
    </div>

    <div class="map-sidebar-group">
      <label class="map-label">COLOR</label>
      <div class="color-palette" id="colorPalette">
        <button class="color-swatch active" data-color="#2ecc71" style="background:#2ecc71"></button>
        <button class="color-swatch" data-color="#e74c3c" style="background:#e74c3c"></button>
        <button class="color-swatch" data-color="#3498db" style="background:#3498db"></button>
        <button class="color-swatch" data-color="#f1c40f" style="background:#f1c40f"></button>
        <button class="color-swatch" data-color="#ffffff" style="background:#ffffff"></button>
        <button class="color-swatch" data-color="#000000" style="background:#000000"></button>
        <button class="color-swatch" data-color="#e67e22" style="background:#e67e22"></button>
        <div class="color-swatch custom-color-btn" id="customColorBtn">
          🎨
          <input type="color" id="colorPicker" value="#2ecc71">
        </div>
      </div>
    </div>

    <div class="map-sidebar-group">
      <div class="size-header">
        <label class="map-label">SIZE (ТОЛЩИНА)</label>
        <span id="sizeValue" class="size-value">4</span>
      </div>
      <input type="range" id="sizeSlider" class="map-range" min="1" max="20" value="4">
    </div>

    <div class="bottom-actions">
      <button class="map-btn btn-undo" id="undoBtn">↩️ Отменить</button>
      <button class="map-btn btn-clear" id="clearBtn">🗑️ Очистить</button>
      <button class="map-btn btn-save" id="saveBtn">💾 Скачать PNG</button>
    </div>

    <div class="sidebar-contact">
      <span>Проблемы? Пишите в Discord:</span><br>
      <a href="https://discordapp.com/users/623589823780749312" target="_blank">@sirofimo4ka</a>
    </div>
  </div>

  <div class="map-canvas-wrapper" id="canvasWrapper">
    <div class="beta-badge">BETA version</div>
    <div class="placement-banner" id="placementBanner">Кликните на карту, чтобы поставить отряд</div>
    
    <div class="canvas-container" id="canvasContainer">
      <!-- Слой 1: Сама картинка карты -->
      <img id="bgMap" src="" alt="Map">
      <!-- Слой 2: Холст для рисования -->
      <canvas id="tacticalCanvas"></canvas>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">-</button>
    </div>

    <button class="squad-toggle" id="squadToggle">🛡️ Отряды</button>
    
    <div class="squad-panel" id="squadPanel">
      <div class="squad-panel-header">
        <h3>Отряды</h3>
        <button class="close-squad-btn" id="closeSquadPanel">✕</button>
      </div>
      <div class="squad-list" id="squadList"></div>
      <div style="padding: 15px; border-top: 1px solid var(--line);">
        <button class="map-btn" style="width: 100%;" id="addSquadBtn">+ Добавить отряд</button>
      </div>
    </div>
  </div>
</div>

<script>
const PADDING = 1000; // Отступ во все стороны (холст больше карты)

const canvas = document.getElementById('tacticalCanvas');
const ctx = canvas.getContext('2d');
const bgMap = document.getElementById('bgMap');
const wrapper = document.getElementById('canvasWrapper');
const container = document.getElementById('canvasContainer');
const banner = document.getElementById('placementBanner');
const mapSelect = document.getElementById('mapSelect');

let currentTool = 'brush';
let currentColor = '#2ecc71';
let currentSize = 4;
let isDrawing = false;
let startX = 0, startY = 0;
let zoom = 1;
let panX = 0, panY = 0;
let mapLoaded = false;

// --- ЗАГРУЗКА КАРТ ИЗ ПАПКИ maps/ ---
mapSelect.addEventListener('change', (e) => {
  const mapId = e.target.value;
  if (!mapId) return;
  loadMap(`maps/${mapId}.jpg`, mapId);
});

function loadMap(baseUrl, mapId) {
  const extensions = ['jpg', 'png', 'jpeg', 'webp'];
  let currentExtIndex = 0;

  function tryLoad() {
    if (currentExtIndex >= extensions.length) {
      alert(`Карта "${mapId}" не найдена в папке maps/.\nПоддерживаемые форматы: .jpg, .png, .jpeg, .webp`);
      return;
    }
    const url = baseUrl.replace('.jpg', '.' + extensions[currentExtIndex]);
    currentExtIndex++;
    
    bgMap.src = url;
  }

  bgMap.onload = () => {
    mapLoaded = true;
    
    // 1. Устанавливаем размеры холста (Картинка + Огромные отступы)
    canvas.width = bgMap.naturalWidth + (PADDING * 2);
    canvas.height = bgMap.naturalHeight + (PADDING * 2);
    
    // 2. Устанавливаем размеры контейнера (чтобы всё влезло)
    container.style.width = canvas.width + 'px';
    container.style.height = canvas.height + 'px';
    
    // 3. Позиционируем картинку по центру контейнера
    bgMap.style.left = PADDING + 'px';
    bgMap.style.top = PADDING + 'px';
    
    // 4. Очищаем холст для нового рисунка
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    saveState();
    
    // 5. Центрируем вид на карте
    fitToScreen();
  };

  bgMap.onerror = tryLoad;
  tryLoad();
}

// Загрузка кастомной карты
document.getElementById('customMapUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    bgMap.src = ev.target.result;
    // Дальнейшая логика обрабатывается в bgMap.onload
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// --- УПРАВЛЕНИЕ КАМЕРОЙ (ЗУМ И ПАН) ---
function fitToScreen() {
  const wrapperWidth = wrapper.clientWidth;
  const wrapperHeight = wrapper.clientHeight;
  // Масштабируем так, чтобы карта занимала 90% экрана (не холст с отступами, а именно карта)
  const scaleX = wrapperWidth / (bgMap.naturalWidth || 1000);
  const scaleY = wrapperHeight / (bgMap.naturalHeight || 1000);
  zoom = Math.min(scaleX, scaleY) * 0.8;
  
  // Центрируем на карте
  panX = (wrapperWidth / 2) - ((canvas.width / 2) * zoom);
  panY = (wrapperHeight / 2) - ((canvas.height / 2) * zoom);
  
  updateTransform();
}

function updateTransform() {
  container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

document.getElementById('zoomIn').onclick = () => { zoom += 0.1; updateTransform(); };
document.getElementById('zoomOut').onclick = () => { zoom = Math.max(0.1, zoom - 0.1); updateTransform(); };

wrapper.addEventListener('wheel', (e) => {
  if (e.ctrlKey) {
    e.preventDefault();
    zoom += e.deltaY * -0.001;
    zoom = Math.min(Math.max(0.1, zoom), 5);
    updateTransform();
  }
}, { passive: false });

let isPanning = false;
let startPanX = 0, startPanY = 0;
wrapper.addEventListener('mousedown', (e) => {
  if (currentTool === 'pan' || e.button === 1) {
    isPanning = true;
    startPanX = e.clientX - panX;
    startPanY = e.clientY - panY;
    wrapper.classList.add('pan-active');
  }
});
window.addEventListener('mousemove', (e) => {
  if (isPanning) {
    panX = e.clientX - startPanX;
    panY = e.clientY - startPanY;
    updateTransform();
  }
});
window.addEventListener('mouseup', () => { 
  isPanning = false; 
  wrapper.classList.remove('pan-active');
});

// --- ИНСТРУМЕНТЫ РИСОВАНИЯ ---
let undoStack = [];
function saveState() {
  if (undoStack.length > 20) undoStack.shift();
  // Ошибка Tainted canvas исчезла, так как на холсте только рисунки
  undoStack.push(canvas.toDataURL());
}
function undo() {
  if (undoStack.length > 0) {
    const imgData = undoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = imgData;
  }
}

function getMousePos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (evt.clientX - rect.left) * scaleX,
    y: (evt.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (currentTool === 'pan' || !mapLoaded) return;
  if (currentTool === 'text') {
    const pos = getMousePos(e);
    const text = prompt("Введите текст:");
    if (text) {
      ctx.fillStyle = currentColor;
      ctx.font = `${currentSize * 5}px Oswald, sans-serif`;
      ctx.fillText(text, pos.x, pos.y);
      saveState();
    }
    return;
  }

  isDrawing = true;
  const pos = getMousePos(e);
  startX = pos.x;
  startY = pos.y;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.strokeStyle = currentColor;
  ctx.fillStyle = currentColor;
  ctx.lineWidth = currentSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  if (currentTool === 'brush') {
    ctx.lineTo(startX, startY);
    ctx.stroke();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  const pos = getMousePos(e);

  if (currentTool === 'brush') {
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!isDrawing) return;
  isDrawing = false;
  const pos = getMousePos(e);
  
  if (currentTool === 'line') {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  } else if (currentTool === 'rect') {
    ctx.beginPath();
    ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
    ctx.stroke();
  }
  
  saveState();
});

// Выбор инструментов
document.querySelectorAll('.tool-grid .map-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-grid .map-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
    if (currentTool === 'pan') {
      canvas.style.cursor = 'grab';
    } else {
      canvas.style.cursor = 'crosshair';
    }
  });
});

// Выбор цвета
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    if (swatch.id === 'customColorBtn') return;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    currentColor = swatch.dataset.color;
    document.getElementById('colorPicker').value = currentColor;
  });
});
document.getElementById('colorPicker').addEventListener('input', (e) => {
  currentColor = e.target.value;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  document.getElementById('customColorBtn').classList.add('active');
});

// Размер кисти
document.getElementById('sizeSlider').addEventListener('input', (e) => {
  currentSize = parseInt(e.target.value);
  document.getElementById('sizeValue').textContent = currentSize;
});

// Кнопки действий
document.getElementById('undoBtn').onclick = undo;
document.getElementById('clearBtn').onclick = () => {
  if (confirm("Очистить всё нарисованное?")) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    saveState();
  }
};

// СОХРАНЕНИЕ КАРТИНКИ (КАРТА + РИСУНКИ)
document.getElementById('saveBtn').onclick = () => {
  // Создаем временный холст, чтобы объединить карту и рисунки
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext('2d');
  
  // 1. Рисуем картинку карты с отступом
  if (bgMap.complete && bgMap.naturalHeight !== 0) {
      tempCtx.drawImage(bgMap, PADDING, PADDING);
  }
  
  // 2. Рисуем холст с поверх рисунками
  tempCtx.drawImage(canvas, 0, 0);
  
  const link = document.createElement('a');
  link.download = 'tactical_map.png';
  link.href = tempCanvas.toDataURL();
  link.click();
};

// --- ОТРЯДЫ ---
let squads = [];
let placingSquadId = null;

document.getElementById('squadToggle').onclick = () => document.getElementById('squadPanel').classList.add('open');
document.getElementById('closeSquadPanel').onclick = () => document.getElementById('squadPanel').classList.remove('open');

document.getElementById('addSquadBtn').onclick = () => {
  const id = 's_' + Date.now();
  squads.push({ id, name: 'Новый отряд', color: '#3498db', players: [], x: 50, y: 50, placed: false });
  renderSquads();
};

function renderSquads() {
  const list = document.getElementById('squadList');
  list.innerHTML = '';
  
  squads.forEach(s => {
    const card = document.createElement('div');
    card.className = 'squad-card';
    
    let playersHtml = s.players.map((p, i) => `<div class="player-tag">${p} <span onclick="removePlayer('${s.id}', ${i})">×</span></div>`).join('');
    
    card.innerHTML = `
      <div class="squad-card-header">
        <input class="squad-name-input" value="${s.name}" onchange="updateSquadName('${s.id}', this.value)">
        <div class="squad-color-dot" style="background:${s.color}"></div>
      </div>
      <div class="player-tags">${playersHtml}</div>
      <div class="add-player-form">
        <input type="text" class="add-player-input" placeholder="Ник..." onkeydown="if(event.key==='Enter') addPlayer('${s.id}', this)">
        <button class="add-player-btn" onclick="addPlayer('${s.id}', this.previousElementSibling)">+</button>
      </div>
      <div class="squad-actions">
        <button class="btn-place" onclick="startPlacingSquad('${s.id}')">${s.placed ? 'Переместить' : 'Поставить'}</button>
        <button class="btn-delete" onclick="deleteSquad('${s.id}')">Удалить</button>
      </div>
    `;
    list.appendChild(card);
  });
}

window.updateSquadName = (id, name) => {
  const s = squads.find(x => x.id === id);
  if (s) { s.name = name; updateMarker(id); }
};
window.removePlayer = (id, index) => {
  const s = squads.find(x => x.id === id);
  if (s) { s.players.splice(index, 1); renderSquads(); updateMarker(id); }
};
window.addPlayer = (id, input) => {
  const val = input.value.trim();
  if (!val) return;
  const s = squads.find(x => x.id === id);
  if (s) { s.players.push(val); input.value = ''; renderSquads(); updateMarker(id); }
};
window.deleteSquad = (id) => {
  squads = squads.filter(x => x.id !== id);
  const marker = document.getElementById('marker-' + id);
  if (marker) marker.remove();
  renderSquads();
};
window.startPlacingSquad = (id) => {
  placingSquadId = id;
  banner.classList.add('active');
};

wrapper.addEventListener('click', (e) => {
  if (!placingSquadId) return;
  
  const rect = canvas.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;

  const s = squads.find(x => x.id === placingSquadId);
  if (s) {
    s.x = Math.max(0, Math.min(100, xPct));
    s.y = Math.max(0, Math.min(100, yPct));
    s.placed = true;
    placingSquadId = null;
    banner.classList.remove('active');
    updateMarker(s.id);
    renderSquads();
  }
});

function updateMarker(id) {
  const s = squads.find(x => x.id === id);
  if (!s || !s.placed) return;
  
  let marker = document.getElementById('marker-' + id);
  if (!marker) {
    marker = document.createElement('div');
    marker.id = 'marker-' + id;
    marker.className = 'squad-marker';
    container.appendChild(marker);
    
    let isDragging = false;
    marker.addEventListener('mousedown', (ev) => {
      ev.stopPropagation();
      isDragging = true;
    });
    window.addEventListener('mousemove', (ev) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      s.x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
      s.y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
      marker.style.left = s.x + '%';
      marker.style.top = s.y + '%';
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
  }
  
  marker.style.left = s.x + '%';
  marker.style.top = s.y + '%';
  marker.style.borderColor = s.color;
  marker.innerHTML = `
    <div class="squad-marker-title" style="color:${s.color}">${s.name}</div>
    <div class="squad-marker-players">${s.players.join('<br>') || 'Нет игроков'}</div>
  `;
}

// --- ТЕМА ---
document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('light-theme');
  localStorage.setItem('cw-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
});
if (localStorage.getItem('cw-theme') === 'light') document.body.classList.add('light-theme');

// Инициализация
canvas.width = 1920;
canvas.height = 1080;
container.style.width = '1920px';
container.style.height = '1080px';
</script>
